name: ai-padrao-vps

services:
  postgres:
    env_file:
      - /opt/ai-padrao/infra/.env.production

  api:
    env_file:
      - /opt/ai-padrao/infra/.env.production
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${WEB_ORIGIN}
    # NOTE: bind-mount removal is NOT achieved by omitting `volumes:`.
    # Docker Compose merges volumes lists by mount-path; entries from
    # the base file are kept. A separate refactor (Task 4b in the plan)
    # moves dev-specific bind-mounts into docker-compose.override.yml
    # so the base can run production-clean without them.

  web:
    env_file:
      - /opt/ai-padrao/infra/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${WEB_ORIGIN}
    # Same caveat as api: bind-mounts from the base are still active
    # in the merged config until Task 4b restructures the dev/prod split.

  caddy:
    build: /opt/ai-padrao/repo/infra/caddy
    container_name: ai-padrao-caddy
    restart: unless-stopped
    # Use Docker secrets (not env_file:) so the file is mounted at
    # /run/secrets/caddy_env to match the path baked into the Caddy
    # CMD in infra/caddy/Dockerfile. Mounting as a secret also enforces
    # 0400 root-only mode, which env_file: does not.
    secrets:
      - caddy_env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - default

secrets:
  caddy_env:
    file: /opt/ai-padrao/infra/.env.production

volumes:
  caddy_data:
  caddy_config:
