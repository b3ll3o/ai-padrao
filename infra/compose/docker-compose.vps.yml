name: ai-padrao-vps

services:
  postgres:
    env_file:
      - /opt/ai-padrao/infra/.env.production
    # Drop the host port mapping from docker-compose.yml. The base compose
    # exposes 5432:5432 for local development convenience; in production the
    # database must only be reachable from the docker network (api talks to
    # it internally). Setting `ports: []` here clears any inherited mapping.
    # Reference: project README forbids well-known ports (5432) in production.
    ports: []

  api:
    env_file:
      - /opt/ai-padrao/infra/.env.production
    environment:
      NODE_ENV: production
      CORS_ORIGINS: ${WEB_ORIGIN}
    # Dev bind-mounts live in docker-compose.override.yml. The base compose is
    # production-clean because Compose only auto-loads docker-compose.override.yml
    # when no `-f` flag is used; this file is invoked via
    # `docker compose -f docker-compose.yml -f infra/compose/docker-compose.vps.yml`
    # which lists files explicitly and therefore does NOT auto-load the override.

  web:
    env_file:
      - /opt/ai-padrao/infra/.env.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${WEB_ORIGIN}
    # Same as api: dev bind-mounts live in docker-compose.override.yml and are
    # not auto-loaded in this production invocation.

  caddy:
    build: /opt/ai-padrao/repo/infra/caddy
    container_name: ai-padrao-caddy
    restart: unless-stopped
    # Use Docker secrets (not env_file:) so the file is mounted at
    # /run/secrets/caddy_env to match the path baked into the Caddy
    # CMD in infra/caddy/Dockerfile. Mounting as a secret also enforces
    # 0400 root-only mode, which env_file: does not.
    secrets:
      - caddy_env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks:
      - default

secrets:
  caddy_env:
    file: /opt/ai-padrao/infra/.env.production

volumes:
  caddy_data:
  caddy_config:
