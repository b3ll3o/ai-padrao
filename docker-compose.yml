name: ai-padrao

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-padrao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ai-padrao-api
    command: pnpm --filter @ai-padrao/api run start:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - api_node_modules:/app/apps/api/node_modules
      - root_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ai-padrao-web
    command: pnpm --filter @ai-padrao/web run dev
    env_file: .env
    environment:
      API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
      - web_node_modules:/app/apps/web/node_modules
      - root_node_modules:/app/node_modules

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ai-padrao-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ai-padrao-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  root_node_modules: