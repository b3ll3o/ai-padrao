name: ai-padrao

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-padrao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ai-padrao-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # Bind-mount the prisma directory so `schema.prisma` and
      # `migrations/` stay in sync with the host. Without this, the
      # image-baked copy of `migrations/` can drift from the live DB
      # after a fresh migration lands on disk but before the container
      # is rebuilt — `prisma migrate dev` then reports a false-positive
      # drift. Matches the hot-reload pattern already used for src/.
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./packages:/app/packages
      - api_node_modules:/app/apps/api/node_modules
      - api_root_node_modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ai-padrao-web
    env_file: .env
    environment:
      API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages:/app/packages
      - web_node_modules:/app/apps/web/node_modules
      - web_root_node_modules:/app/node_modules

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ai-padrao-otel
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ai-padrao-mailhog
    ports:
      # Host ports remapped to avoid collision with sibling pedi_ai_mailpit
      # (which binds 1025/8025). Container ports stay at 1025/8025 so internal
      # references (SMTP_PORT=1025 in .env) remain unchanged.
      - "11125:1025"
      - "18025:8025"

volumes:
  pgdata:
  # Per-service volumes: a shared /app/node_modules volume would be populated by
  # whichever container mounted it last, leaving the other with the wrong tree.
  api_node_modules:
  web_node_modules:
  api_root_node_modules:
  web_root_node_modules: