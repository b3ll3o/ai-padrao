name: ai-padrao

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-padrao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-padrao-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
        required: false
    ports:
      - "3001:3001"
    # No bind-mounts: this image runs the compiled output from /app/apps/api/dist.
    # Local-dev hot-reload mounts live in docker-compose.override.yml.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-padrao-web
    env_file: .env
    environment:
      API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    # No bind-mounts: this image serves the built Next.js output from
    # /app/apps/web/.next. Local-dev hot-reload mounts live in
    # docker-compose.override.yml.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: ai-padrao-otel
    profiles:
      - dev-tools
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ai-padrao-mailhog
    profiles:
      - dev-tools
    ports:
      # Host ports remapped to avoid collision with sibling pedi_ai_mailpit
      # (which binds 1025/8025). Container ports stay at 1025/8025 so internal
      # references (SMTP_PORT=1025 in .env) remain unchanged.
      - "11125:1025"
      - "18025:8025"

volumes:
  pgdata: